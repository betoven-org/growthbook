services:
  mongo:
    image: "mongo:7"
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-growthbook}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:?Defina MONGO_PASSWORD nas variaveis do Coolify}
    volumes:
      - mongodata:/data/db

  growthbook:
    image: "growthbook/growthbook:latest"
    expose:
      - "3000"
      - "3100"
    depends_on:
      - mongo
    restart: unless-stopped
    environment:
      - MONGODB_URI=mongodb://${MONGO_USER:-growthbook}:${MONGO_PASSWORD}@mongo:27017/growthbook?authSource=admin
      - APP_ORIGIN=${APP_ORIGIN:?Defina APP_ORIGIN com a URL publica do frontend}
      - API_HOST=${API_HOST:?Defina API_HOST com a URL publica da API}
      - JWT_SECRET=${JWT_SECRET:?Defina JWT_SECRET com uma string aleatoria longa}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?Defina ENCRYPTION_KEY com uma string aleatoria longa}
      - NODE_ENV=production
      - DISABLE_TELEMETRY=true
      - EMAIL_ENABLED=${EMAIL_ENABLED:-false}
      - EMAIL_HOST=${EMAIL_HOST:-}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
    volumes:
      - uploads:/usr/local/src/app/packages/back-end/uploads

  proxy:
    image: "nginx:alpine"
    expose:
      - "80"
    depends_on:
      - growthbook
    restart: unless-stopped
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf

configs:
  nginx_conf:
    content: |
      upstream frontend {
          server growthbook:3000;
      }
      upstream backend {
          server growthbook:3100;
      }
      server {
          listen 80;
          server_name _;
          client_max_body_size 50m;
          proxy_http_version 1.1;
          proxy_set_header Host $$host;
          proxy_set_header X-Real-IP $$remote_addr;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $$scheme;

          location /api/ {
              proxy_pass http://backend;
          }
          location /auth/ {
              proxy_pass http://backend;
          }
          location /oauth/ {
              proxy_pass http://backend;
          }
          location / {
              proxy_pass http://frontend;
          }
      }

volumes:
  mongodata:
  uploads:
